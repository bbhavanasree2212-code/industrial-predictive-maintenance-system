
apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-maintenance-dashboard
  labels:
    app: industrial-maintenance-dashboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: industrial-maintenance-dashboard
  template:
    metadata:
      labels:
        app: industrial-maintenance-dashboard
    spec:
      containers:
        - name: dashboard
          image: YOUR_DOCKERHUB_USERNAME/industrial-maintenance-dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: industrial-maintenance-dashboard
spec:
  type: NodePort
  selector:
    app: industrial-maintenance-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30089
